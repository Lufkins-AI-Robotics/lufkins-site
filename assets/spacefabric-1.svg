<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <radialGradient id="sf1-glow" cx="400" cy="200" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6a5acd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6a5acd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sf1-grid" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6a5acd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Glow at warp center -->
  <circle cx="400" cy="200" r="200" fill="url(#sf1-glow)"/>

  <!-- Horizontal grid lines warped by gravity well -->
  <g fill="none" stroke="url(#sf1-grid)" stroke-width="1.2" opacity="0.7">
    <path d="M 50,80 C 200,80 300,78 360,76 Q 400,74 440,76 C 500,78 600,80 750,80"/>
    <path d="M 50,130 C 200,130 280,126 350,118 Q 400,112 450,118 C 520,126 600,130 750,130"/>
    <path d="M 50,180 C 180,180 260,172 330,155 Q 400,140 470,155 C 540,172 620,180 750,180"/>
    <path d="M 50,230 C 180,230 260,226 320,215 Q 400,200 480,215 C 540,226 620,230 750,230"/>
    <path d="M 50,280 C 180,280 270,285 340,310 Q 400,340 460,310 C 530,285 620,280 750,280"/>
    <path d="M 50,330 C 200,330 290,335 355,355 Q 400,375 445,355 C 510,335 600,330 750,330"/>
    <path d="M 50,380 C 200,380 310,383 365,392 Q 400,400 435,392 C 490,383 600,380 750,380"/>
    <path d="M 50,430 C 200,430 320,431 370,435 Q 400,438 430,435 C 480,431 600,430 750,430"/>
  </g>

  <!-- Vertical grid lines warped -->
  <g fill="none" stroke="url(#sf1-grid)" stroke-width="1.2" opacity="0.7">
    <path d="M 150,50 C 150,150 148,200 146,250 Q 145,280 146,310 C 148,360 150,400 150,460"/>
    <path d="M 230,50 C 230,140 224,190 215,240 Q 210,270 215,300 C 224,350 230,400 230,460"/>
    <path d="M 310,50 C 310,130 296,175 275,225 Q 265,260 275,295 C 296,345 310,400 310,460"/>
    <path d="M 390,50 C 390,120 385,155 380,200 Q 378,250 380,300 C 385,345 390,400 390,460"/>
    <path d="M 410,50 C 410,120 415,155 420,200 Q 422,250 420,300 C 415,345 410,400 410,460"/>
    <path d="M 490,50 C 490,130 504,175 525,225 Q 535,260 525,295 C 504,345 490,400 490,460"/>
    <path d="M 570,50 C 570,140 576,190 585,240 Q 590,270 585,300 C 576,350 570,400 570,460"/>
    <path d="M 650,50 C 650,150 652,200 654,250 Q 655,280 654,310 C 652,360 650,400 650,460"/>
  </g>
</svg>
