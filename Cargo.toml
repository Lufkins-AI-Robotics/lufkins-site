[package]
name = "lufkins"
version = "0.1.0"
edition = "2024"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-render = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "HtmlElement",
  "CssStyleDeclaration",
  "Element",
  "NodeList",
  "DomRect",
  "DomTokenList",
  "PointerEvent",
  "MouseEvent",
  "EventTarget",
  "ResizeObserver",
  "ResizeObserverEntry",
  "MutationObserver",
  "MutationObserverInit",
  "IntersectionObserver",
  "IntersectionObserverInit",
  "IntersectionObserverEntry",
] }
rand = "0.10.0"
getrandom = { version = "0.4", features = ["wasm_js"] }
